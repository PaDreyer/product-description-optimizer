name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create test environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pdo-test-venv"
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pip install -e '.[dev,desktop,gemini,zhipuai,openai]'
      - name: Lint and format check
        run: |
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m ruff check src/ tests/
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m ruff format --check src/ tests/
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pytest tests/ -q
