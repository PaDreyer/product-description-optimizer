[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdo.desktop" = ["logo.png"]

[project]
name = "pdo"
version = "0.2.0"
description = "AI-powered desktop app and CLI for optimizing product descriptions from CSV files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
zhipuai = [
    "zhipuai>=2.0",
]
openai = [
    "openai>=1.66.0",
]
desktop = [
    "PySide6>=6.8,<7",
    "dbus-next>=0.2,<0.3; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
pdo = "pdo.cli.main:cli"

[project.gui-scripts]
pdo-desktop = "pdo.desktop.app:main"

# ── Tool configuration ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
