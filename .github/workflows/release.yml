name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check release tag
        id: version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(PYTHONPATH=src python -c 'import pdo; print(pdo.__version__)')"
          test "$package_version" = "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create test environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pdo-test-venv"
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pip install -e '.[dev,desktop,gemini,zhipuai,openai]'
      - name: Lint and format check
        run: |
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m ruff check src/ tests/
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m ruff format --check src/ tests/
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/pdo-test-venv/bin/python" -m pytest tests/ -q

  linux:
    name: Build AppImage and Debian package
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux packages in container
        run: ./scripts/build-linux-container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PDO-${{ needs.verify.outputs.version }}-Linux
          path: |
            dist/PDO-*.AppImage
            dist/PDO-*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: PDO-${{ needs.verify.outputs.version }}-Windows
          path: dist/installer/PDO-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [verify, linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: PDO-${{ needs.verify.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum PDO-* > SHA256SUMS.txt
      - name: Write release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_REF_NAME"
            heading="Changes since $previous_tag"
          else
            range="$GITHUB_REF_NAME"
            heading="Changes in this release"
          fi
          {
            echo "## $heading"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
          } > release-notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "PDO $RELEASE_VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --title "PDO $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
